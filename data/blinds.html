<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101522">
  <title>Tapparelle · Relay Studio</title>
  <style>
    :root { color-scheme:dark; --bg:#101522; --panel:#1b2535; --muted:#929db0; --text:#f4f6fb; --lime:#d5ef72; --cyan:#75e0d1; --line:#ffffff18; --red:#ff8585 }
    * { box-sizing:border-box }
    body { margin:0; min-height:100vh; color:var(--text); background:radial-gradient(ellipse at 12% 0,#355344 0,transparent 34%),radial-gradient(ellipse at 100% 15%,#303d4a 0,transparent 30%),var(--bg); font:16px/1.45 "Trebuchet MS",system-ui,sans-serif }
    button,input { font:inherit }
    .wrap { width:min(100% - 28px,820px); margin:auto; padding:22px 0 40px }
    header,.brand,nav,.connection { display:flex; align-items:center }
    header { justify-content:space-between; gap:12px }
    .brand { gap:10px; font-weight:800 }
    .mark { display:grid; place-items:center; width:38px; height:38px; border-radius:11px; color:#132018; background:var(--lime); font-size:21px }
    nav { gap:4px; padding:4px; border:1px solid var(--line); border-radius:10px; background:#ffffff08 }
    nav a { padding:7px 10px; border-radius:7px; color:var(--muted); text-decoration:none; font-size:12px; font-weight:700 }
    nav a.active { color:var(--text); background:#ffffff14 }
    .eyebrow { color:var(--lime); font-size:11px; font-weight:800; letter-spacing:.13em; text-transform:uppercase }
    .intro { padding:38px 2px 20px }
    h1 { margin:8px 0 6px; font-size:clamp(30px,7vw,48px); line-height:1.04 }
    .sub { max-width:590px; margin:0; color:var(--muted); font-size:14px }
    .connection { gap:9px; margin:10px 0 22px; color:#d9e0ea; font-size:12px }
    .dot { width:8px; height:8px; border-radius:50%; background:#778294 }
    .connection[data-state="live"] .dot { background:var(--lime); box-shadow:0 0 12px #d5ef7288 }
    .connection[data-state="error"] .dot { background:var(--red) }
    .workspace { display:grid; grid-template-columns:minmax(190px,.8fr) minmax(0,1.2fr); gap:32px; align-items:center; min-width:0; padding:24px; border:1px solid var(--line); border-radius:16px; background:linear-gradient(135deg,#ffffff0b,#ffffff04) }
    .workspace > * { min-width:0 }
    .preview { display:grid; justify-items:center; gap:13px }
    .window { position:relative; width:min(100%,230px); aspect-ratio:4/5; padding:12px; border:5px solid #c9d1c4; border-radius:8px; background:#242e35; box-shadow:0 18px 45px #0004 }
    .glass { position:absolute; inset:12px; overflow:hidden; background:linear-gradient(150deg,#96bdad 0,#4a7771 55%,#294c50 100%) }
    .glass::before,.glass::after { content:""; position:absolute; bottom:0; width:46%; height:39%; background:#263839; clip-path:polygon(50% 0,100% 100%,0 100%) }
    .glass::before { left:4% }
    .glass::after { right:4%; height:50%; background:#354643 }
    .shade { position:absolute; z-index:1; top:0; left:0; width:100%; height:var(--shade-height,100%); background:repeating-linear-gradient(to bottom,#303b3d 0 10px,#53605e 10px 13px); border-bottom:4px solid #87938d; transition:height .5s ease }
    .position-readout { color:var(--lime); font-size:13px; font-weight:800 }
    .controls h2 { margin:0 0 5px; font-size:17px }
    .controls > p { margin:0; color:var(--muted); font-size:12px }
    .action-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin-top:18px }
    .blind-action { display:flex; align-items:center; gap:12px; min-width:0; min-height:76px; padding:12px; border:1px solid var(--line); border-radius:10px; color:var(--text); background:linear-gradient(145deg,var(--panel2),var(--panel)); text-align:left; cursor:pointer; transition:transform .15s,border-color .15s }
    .blind-action:hover { transform:translateY(-2px); border-color:#75e0d188 }
    .blind-action:disabled { opacity:.55; cursor:wait; transform:none }
    .blind-action strong,.blind-action small { display:block }
    .blind-action span:last-child { min-width:0; overflow-wrap:anywhere }
    .blind-action strong { font-size:14px }
    .blind-action small { margin-top:4px; color:var(--muted); font-size:10px }
    .action-symbol { display:grid; place-items:center; flex:0 0 38px; aspect-ratio:1; border-radius:9px; color:#10201f; background:var(--lime); font-size:22px; font-weight:800 }
    .field { display:grid; grid-template-columns:1fr 100px; align-items:center; gap:12px; padding-top:15px; border-top:1px solid var(--line); color:#d9e0ea; font-size:12px }
    input { width:100%; min-height:40px; padding:8px 10px; border:1px solid var(--line); border-radius:7px; color:var(--text); background:#111827; text-align:right }
    input:focus-visible,button:focus-visible,a:focus-visible { outline:2px solid var(--lime); outline-offset:2px }
    .unit { color:var(--muted); font-size:10px }
    .notice { min-height:36px; margin:14px 0 0; color:var(--muted); font-size:12px }
    .notice[data-state="ok"] { color:var(--lime) }
    .notice[data-state="error"] { color:var(--red) }
    footer { margin-top:18px; color:var(--muted); font-size:11px }
    @media(max-width:620px) { .workspace { grid-template-columns:1fr; gap:24px; padding:18px } .intro { padding-top:28px } }
    @media(max-width:380px) { .wrap { width:calc(100% - 20px) } header { flex-wrap:wrap } nav { margin-left:auto } .action-grid { grid-template-columns:1fr; gap:8px } }
  </style>
  <link rel="stylesheet" href="/theme.css">
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand"><span class="mark">ϟ</span><span>Relay Studio</span></div>
      <button class="nav-toggle" type="button" aria-label="Apri navigazione" aria-expanded="false" aria-controls="site-nav"><span></span><span></span><span></span></button>
      <nav id="site-nav" class="site-nav"><a href="/" data-route="devices">Dispositivi</a><a href="/blinds" data-route="blinds">Tapparelle</a><a href="/info" data-route="system">Sistema</a></nav>
    </header>
    <section class="intro">
      <div class="eyebrow">Controllo locale</div>
      <h1>Tapparelle</h1>
      <p class="sub">Quattro comandi; la sequenza e i tempi sono gestiti dalla scheda.</p>
    </section>
    <main class="workspace">
      <section class="controls" aria-labelledby="control-title">
        <h2 id="control-title">Comandi</h2>
        <div class="action-grid" role="group" aria-label="Comandi tapparelle">
          <button class="blind-action" type="button" data-action="down"><span class="action-symbol" aria-hidden="true">↓</span><span><strong>Tutto giù</strong><small>Impulso 3 secondi</small></span></button>
          <button class="blind-action" type="button" data-action="up_short"><span class="action-symbol" aria-hidden="true">↗</span><span><strong>Alza poco</strong><small>Ciclo totale · 6,5 s</small></span></button>
          <button class="blind-action" type="button" data-action="up_half"><span class="action-symbol" aria-hidden="true">↑</span><span><strong>Alza a metà</strong><small>Ciclo totale · 18,2 s</small></span></button>
          <button class="blind-action" type="button" data-action="up"><span class="action-symbol" aria-hidden="true">⇧</span><span><strong>Alza tutto</strong><small>Impulso 3 secondi</small></span></button>
        </div>
        <p id="notice" class="notice" aria-live="polite">Pronto</p>
      </section>
    </main>
    <footer>Un nuovo comando interrompe la sequenza precedente.</footer>
  </div>
  <script src="/site.js" defer></script>
  <script>
    const notice = document.querySelector("#notice");
    const actionButtons = [...document.querySelectorAll(".blind-action")];
    async function sendAction(action, button) {
      actionButtons.forEach((item) => item.disabled = true);
      notice.dataset.state = "";
      notice.textContent = `Invio comando: ${button.querySelector("strong").textContent}…`;
      try {
        const response = await fetch("/api/blinds", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: new URLSearchParams({ action }),
        });
        if (!response.ok) throw new Error("La scheda non ha accettato il comando.");
        notice.dataset.state = "ok";
        notice.textContent = "Comando ricevuto dalla scheda.";
      } catch (error) {
        notice.dataset.state = "error";
        notice.textContent = error.message || "Invio non riuscito.";
      } finally {
        actionButtons.forEach((item) => item.disabled = false);
      }
    }
    actionButtons.forEach((button) => button.addEventListener("click", () => {
      void sendAction(button.dataset.action, button);
    }));
  </script>
</body>
</html>
