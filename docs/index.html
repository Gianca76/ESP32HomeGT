<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101522">
  <title>Relay Studio</title>
  <style>
    :root {
      color-scheme: dark;
      --bg:#101522; --panel:#1a2232; --panel2:#202b3d;
      --text:#f4f6fb; --muted:#929db0; --cyan:#75e0d1;
      --gold:#ffca7a; --line:#ffffff12; --green:#64e0ab; --red:#ff8585;
    }
    * { box-sizing:border-box }
    body {
      margin:0; min-height:100vh; color:var(--text);
      background:radial-gradient(ellipse at 10% -10%,#294b59 0,transparent 38%),radial-gradient(ellipse at 100% 5%,#463247 0,transparent 30%),var(--bg);
      font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;
    }
    button,input,select { font:inherit }
    button { color:inherit }
    .shell { width:min(100% - 28px,760px); margin:auto; padding:22px 0 40px }
    header,.toolbar,.relay-top,.device-meta { display:flex; align-items:center; justify-content:space-between; gap:12px }
    header { min-height:42px }
    .brand { display:flex; align-items:center; gap:10px; font-weight:750 }
    nav { display:flex; gap:4px; padding:4px; border:1px solid var(--line); border-radius:9px; background:#ffffff08 }
    nav a { padding:7px 10px; color:var(--muted); text-decoration:none; border-radius:6px; font-size:12px; font-weight:650 }
    nav a.active { color:var(--text); background:#ffffff12 }
    .mark { display:grid; place-items:center; width:38px; height:38px; border-radius:12px; color:#10201f; background:linear-gradient(145deg,#a3f4df,#62c9d6); font-size:20px }
    .status { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:12px }
    .status-dot { width:8px; height:8px; border-radius:50%; background:#747d8e }
    .status[data-state="live"] .status-dot { background:var(--green); box-shadow:0 0 12px #64e0ab88 }
    .status[data-state="error"] .status-dot { background:var(--red) }
    .intro { padding:32px 2px 22px }
    .eyebrow { color:var(--cyan); font-size:11px; font-weight:800; letter-spacing:.14em; text-transform:uppercase }
    h1 { margin:8px 0 6px; font-size:32px; line-height:1.08 }
    .muted { margin:0; color:var(--muted); font-size:14px }
    .panel { border:1px solid var(--line); border-radius:14px; background:#ffffff08; padding:18px }
    .login { max-width:420px; margin:10px auto 0 }
    .login h2 { margin:0 0 16px; font-size:18px }
    .field { display:grid; gap:6px; margin-top:12px; color:#d9e0ea; font-size:12px }
    input,select { width:100%; min-height:42px; padding:9px 11px; border:1px solid #ffffff1a; border-radius:8px; color:var(--text); background:#111827 }
    input:focus,select:focus,button:focus-visible { outline:2px solid var(--cyan); outline-offset:2px }
    .primary { width:100%; min-height:42px; margin-top:16px; border:0; border-radius:8px; color:#10201f; background:var(--cyan); font-weight:750; cursor:pointer }
    .primary:disabled,.relay:disabled { opacity:.6; cursor:wait }
    .error { min-height:20px; margin:10px 0 0; color:var(--red); font-size:12px }
    [hidden] { display:none !important }
    .toolbar { align-items:end; margin:20px 0 15px }
    .device-picker { width:min(100%,390px) }
    .device-meta { justify-content:flex-start; flex-wrap:wrap; color:var(--muted); font-size:12px }
    .device-meta span { padding:5px 9px; border:1px solid var(--line); border-radius:7px; background:#ffffff08 }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:11px }
    .relay { min-width:0; min-height:148px; padding:15px; border:1px solid var(--line); border-radius:12px; text-align:left; background:linear-gradient(145deg,var(--panel2),var(--panel)); cursor:pointer; transition:.16s transform,.16s border-color,.16s background }
    .relay:active { transform:scale(.985) }
    .relay.on { border-color:#75e0d188; background:linear-gradient(145deg,#23453f,#1b3037) }
    .relay.pending { border-color:#ffca7a88 }
    .relay[aria-disabled="true"] { cursor:default }
    .number { display:grid; place-items:center; width:34px; height:34px; border-radius:9px; background:#ffffff0c; color:var(--gold); font-size:12px; font-weight:800 }
    .switch { width:42px; height:25px; padding:3px; border-radius:20px; background:#3a4353 }
    .switch::after { content:""; display:block; width:19px; height:19px; border-radius:50%; background:#c6ccd6; transition:transform .16s,background .16s }
    .relay.on .switch { background:#54cdb2 }
    .relay.on .switch::after { transform:translateX(17px); background:#fff }
    .name { margin-top:15px; overflow-wrap:anywhere; font-size:16px; font-weight:730 }
    .relay-state { margin-top:7px; color:var(--muted); font-size:11px; font-weight:750; letter-spacing:.08em }
    .relay.on .relay-state { color:var(--cyan) }
    .relay.pending .relay-state { color:var(--gold) }
    .signout { min-height:36px; padding:0 12px; border:1px solid var(--line); border-radius:8px; background:#ffffff08; cursor:pointer }
    footer { margin-top:18px; color:var(--muted); font-size:11px; text-align:center }
    @media(max-width:430px) { .shell { width:calc(100% - 20px) } .panel { padding:14px } .grid { gap:8px } .relay { min-height:138px; padding:12px } .toolbar { align-items:stretch; flex-direction:column } }
    @media(max-width:430px) { header { display:grid; grid-template-columns:minmax(0,1fr) auto; } header .brand { grid-column:1; grid-row:1; min-width:0 } header .status { grid-column:2; grid-row:1; min-width:0; justify-content:flex-end; flex-wrap:wrap } header nav { grid-column:1/-1; grid-row:2; width:max-content; max-width:100% } }
    @media(max-width:370px) { header { gap:7px } .brand { gap:7px; font-size:13px } .status { gap:5px; font-size:10px } }
  </style>
  <link rel="stylesheet" href="./theme.css">
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand"><span class="mark">ϟ</span><span>Relay Studio</span></div>
      <button class="nav-toggle" type="button" aria-label="Apri navigazione" aria-expanded="false" aria-controls="site-nav"><span></span><span></span><span></span></button>
      <nav id="site-nav" class="site-nav"><a href="./" data-route="devices">Dispositivi</a><a href="./blinds.html" data-route="blinds">Tapparelle</a><a href="./system.html" data-route="system">Sistema</a></nav>
      <div id="connection" class="status" data-state="offline" role="status"><span class="status-dot"></span><span id="connection-label">Disconnesso</span></div>
    </header>

    <section class="intro">
      <div class="eyebrow">ESP32 · Controllo remoto</div>
      <h1>Dispositivi</h1>
      <p class="muted">Seleziona un dispositivo per vedere stato e comandi disponibili.</p>
    </section>

    <section id="login-panel" class="panel login">
      <h2>Accedi</h2>
      <form id="login-form">
        <label class="field">Email<input name="email" type="email" autocomplete="username" required></label>
        <label class="field">Password<input name="password" type="password" autocomplete="current-password" required></label>
        <button class="primary" type="submit">Accedi</button>
      </form>
      <p id="login-error" class="error" aria-live="polite"></p>
    </section>

    <main id="dashboard" hidden>
      <div class="toolbar">
        <label class="field device-picker">Dispositivo<select id="device-select"></select></label>
        <button id="signout" class="signout" type="button">Esci</button>
      </div>
      <div id="device-meta" class="device-meta" aria-live="polite"></div>
      <p id="dashboard-error" class="error" aria-live="polite"></p>
      <section id="relay-grid" class="grid" aria-label="Stato dei relè"></section>
      <footer id="updated-at"></footer>
    </main>
  </div>

  <script src="./site.js" defer></script>
  <script type="module" src="./app.js?v=e945967"></script>
</body>
</html>
